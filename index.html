<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐉 端午安康 🐉</title>
<style>
:root {
  --gold: #d4a853;
  --gold-bright: #f0d78c;
  --jade: #4a7c4f;
  --ink: #1a1a2e;
  --card-bg: rgba(18, 22, 38, 0.65);
  --text: #ede4d3;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:100vw; min-height:100vh;
  background:#040b18;
  font-family:"Noto Serif SC","STSong","SimSun","KaiTi","STKaiti",serif;
  overflow-x:hidden; cursor:default;
  user-select:none; -webkit-tap-highlight-color:transparent;
}

/* ========= CANVAS ========= */
#scene {
  position:fixed; top:0; left:0; width:100%; height:100%; z-index:0;
}

/* ========= PARTICLES TRAY ========= */
#ptray {
  position:fixed; top:0; left:0; width:100%; height:100%;
  pointer-events:none; z-index:1;
}

/* ========= LANTERN ========= */
.lantern {
  position:fixed; pointer-events:none; z-index:2;
}
.lantern-body {
  width:32px; height:44px;
  background:radial-gradient(ellipse at 50% 40%, #ff9a45 0%, #e85d3a 40%, #b92d20 100%);
  border-radius:50% 50% 40% 40%;
  box-shadow:0 0 22px rgba(255,140,66,0.6), 0 0 60px rgba(255,100,50,0.3), 0 0 100px rgba(255,80,40,0.12);
  position:relative; margin:0 auto;
}
.lantern-body::before {
  content:''; position:absolute; top:-6px; left:50%; transform:translateX(-50%);
  width:20px; height:6px; background:#c9a96e; border-radius:3px 3px 1px 1px;
}
.lantern-body::after {
  content:''; position:absolute; bottom:-10px; left:50%; transform:translateX(-50%);
  width:2px; height:10px; background:rgba(201,169,110,0.8);
}
.lantern-tassel {
  width:8px; height:14px;
  background:linear-gradient(to bottom, #c9a96e, #e8c97a);
  margin:0 auto; border-radius:0 0 3px 3px;
  animation:tasselSway 1.6s ease-in-out infinite;
}
@keyframes tasselSway {
  0%,100% { transform:rotate(-4deg); }
  50% { transform:rotate(4deg); }
}

/* ========= FIREFLY ========= */
.firefly {
  position:fixed; pointer-events:none; z-index:3;
  width:5px; height:5px;
  background:radial-gradient(circle, #fffbe6, rgba(253,224,110,0));
  border-radius:50%;
  box-shadow:0 0 8px #ffeaa7, 0 0 18px rgba(253,203,110,0.6), 0 0 32px rgba(253,203,110,0.2);
}

/* ========= BAMBOO LEAF ========= */
.bamboo-leaf {
  position:fixed; pointer-events:none; z-index:2;
}

/* ========= OVERLAY CARD ========= */
.overlay {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  z-index:10; pointer-events:none;
}
.card {
  pointer-events:auto; position:relative;
  background:rgba(14,18,30,0.6);
  backdrop-filter:blur(28px); -webkit-backdrop-filter:blur(28px);
  border:1.5px solid rgba(212,168,83,0.3);
  border-radius:28px;
  padding:50px 44px 40px;
  max-width:600px; width:90%;
  text-align:center;
  box-shadow:
    0 12px 60px rgba(0,0,0,0.5),
    0 0 80px rgba(212,168,83,0.06),
    0 0 200px rgba(212,168,83,0.03),
    inset 0 1px 0 rgba(255,255,255,0.03),
    inset 0 -1px 0 rgba(0,0,0,0.2);
  animation:cardEnter 1.4s cubic-bezier(0.22,1,0.36,1) both;
  overflow:hidden;
}
/* Card inner glow top */
.card::before {
  content:''; position:absolute; top:-1px; left:5%; right:5%; height:1px;
  background:linear-gradient(90deg, transparent, rgba(240,215,140,0.5), transparent);
  z-index:2;
}
/* Card corner dots */
.card .cnr { position:absolute; color:var(--gold); opacity:0.35; font-size:16px; z-index:2; }
.card .cnr-tl { top:14px; left:18px; }
.card .cnr-tr { top:14px; right:18px; }
.card .cnr-bl { bottom:14px; left:18px; }
.card .cnr-br { bottom:14px; right:18px; }

@keyframes cardEnter {
  0% { opacity:0; transform:translateY(50px) scale(0.92); }
  100% { opacity:1; transform:translateY(0) scale(1); }
}

/* Card animated border glow */
@keyframes borderGlow {
  0%,100% { border-color:rgba(212,168,83,0.3); }
  50% { border-color:rgba(240,215,140,0.5); }
}
.card { animation:cardEnter 1.4s cubic-bezier(0.22,1,0.36,1) both, borderGlow 4s ease-in-out 2s infinite; }

.card .icon-row {
  font-size:42px; margin-bottom:12px;
  animation:gentleBob 3.2s ease-in-out infinite;
}
@keyframes gentleBob {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-9px); }
}
.card h1 {
  font-size:clamp(2.1rem, 5.5vw, 3.2rem); font-weight:700;
  background:linear-gradient(135deg, #f0d78c, #c9a053, #e8c97a, #b8933e, #f0d78c);
  background-size:250% 250%;
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:goldShimmer 3.5s ease-in-out infinite;
  margin-bottom:6px; letter-spacing:6px;
  text-shadow:none;
  filter:drop-shadow(0 0 12px rgba(212,168,83,0.3));
}
@keyframes goldShimmer {
  0%,100% { background-position:0% 50%; }
  50% { background-position:100% 50%; }
}
.card .subtitle {
  font-size:0.85rem; color:rgba(232,201,122,0.55);
  letter-spacing:4px; margin-bottom:28px; text-transform:uppercase;
}
.card .wish {
  font-size:1.08rem; color:var(--text);
  line-height:2.3; text-align:center; min-height:100px;
}
.card .wish .line {
  opacity:0;
  animation:fadeInLine 0.7s ease-out forwards;
  white-space:pre-line;
}
@keyframes fadeInLine {
  0% { opacity:0; transform:translateY(10px); filter:blur(4px); }
  100% { opacity:1; transform:translateY(0); filter:blur(0); }
}
.card .divider {
  width:70px; height:1.5px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  margin:24px auto; opacity:0.5;
}
.card .signature {
  font-size:0.95rem; color:rgba(240,215,140,0.65);
  font-style:italic; margin-top:8px;
  opacity:0;
  animation:fadeInLine 0.8s ease-out forwards;
}

/* ========= CLICK EFFECTS ========= */
.sparkle {
  position:fixed; pointer-events:none;
  font-size:30px; z-index:100;
  animation:sparklePop 0.95s ease-out forwards;
}
@keyframes sparklePop {
  0% { transform:scale(0) translateY(0); opacity:1; }
  100% { transform:scale(1.8) translateY(-80px); opacity:0; }
}

.ripple {
  position:fixed; pointer-events:none;
  border-radius:50%;
  border:1px solid rgba(240,215,140,0.5);
  z-index:5;
  animation:rippleOut 1.6s ease-out forwards;
}
@keyframes rippleOut {
  0% { width:0; height:0; opacity:0.9; }
  100% { width:140px; height:140px; opacity:0; margin-left:-70px; margin-top:-70px; }
}

/* ========= RESPONSIVE ========= */
@media (max-width:480px) {
  .card { padding:34px 22px 28px; border-radius:22px; }
  .card h1 { font-size:1.7rem; letter-spacing:3px; }
  .card .icon-row { font-size:32px; }
  .card .wish { font-size:0.92rem; line-height:2.1; }
  .lantern-body { width:22px; height:32px; }
}
</style>
</head>
<body>

<canvas id="scene"></canvas>
<div id="ptray"></div>

<div class="overlay">
  <div class="card" id="card">
    <span class="cnr cnr-tl">❖</span>
    <span class="cnr cnr-tr">❖</span>
    <span class="cnr cnr-bl">❖</span>
    <span class="cnr cnr-br">❖</span>
    <div class="icon-row">🐉🌿🏮🌿🐉</div>
    <h1>端午安康</h1>
    <div class="subtitle">Dragon Boat Festival · 2026</div>
    <div class="wish" id="wish">
      <div class="line" style="animation-delay:0.7s;">粽叶飘香，龙舟竞渡</div>
      <div class="line" style="animation-delay:1.3s;">又是一年端阳时</div>
      <div class="line" style="animation-delay:1.9s;">愿你的生活如糯米般软糯香甜</div>
      <div class="line" style="animation-delay:2.5s;">愿你的人生如龙舟般乘风破浪</div>
      <div class="line" style="animation-delay:3.2s;">艾蒲青青，为你驱散世间烦忧</div>
      <div class="line" style="animation-delay:3.9s;">粽香袅袅，包裹我所有的祝福</div>
      <div class="line" style="animation-delay:4.7s;">世界很大，但总有一个人记得你</div>
      <div class="line" style="animation-delay:5.4s;">节日很多，但这个端午只为你祈愿</div>
    </div>
    <div class="divider"></div>
    <div class="signature" style="animation-delay:5.9s;">—— 端午安康，吴总 🌟</div>
  </div>
</div>

<script>
// ============================================================
//  CANVAS SCENE — Cinematic Dragon Boat Night
// ============================================================
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');

let W, H, T = 0;  // T = time in ms

function resize() {
  W = cv.width = window.innerWidth;
  H = cv.height = window.innerHeight;
}
resize();
window.addEventListener('resize', () => { resize(); initScene(); });

// --- Sky gradient ---
function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#030b1a');
  g.addColorStop(0.25, '#061430');
  g.addColorStop(0.5, '#0d2438');
  g.addColorStop(0.72, '#143a40');
  g.addColorStop(0.88, '#1a4a3a');
  g.addColorStop(1, '#0e2a1c');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

// --- Stars ---
let stars = [];
function initStars() {
  stars = [];
  for (let i = 0; i < 200; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.5,
      r: 0.3 + Math.random() * 1.8,
      phase: Math.random() * Math.PI * 2,
      speed: 0.004 + Math.random() * 0.04,
      hue: Math.random() < 0.08 ? 30 + Math.random() * 20 : 0 // some warm stars
    });
  }
}

function drawStars() {
  stars.forEach(s => {
    const a = 0.25 + 0.75 * Math.abs(Math.sin(s.phase + T * s.speed));
    const h = s.hue || 60;
    ctx.fillStyle = s.hue
      ? `rgba(255,${220 + Math.floor(Math.random()*35)},${140 + Math.floor(Math.random()*60)},${a})`
      : `rgba(230,240,255,${a})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- Shooting stars ---
let shootingStars = [];

function maybeSpawnShootingStar() {
  if (Math.random() < 0.004 && shootingStars.length < 2) {
    shootingStars.push({
      x: W * 0.2 + Math.random() * W * 0.6,
      y: H * 0.02 + Math.random() * H * 0.2,
      life: 0, maxLife: 60 + Math.random() * 60,
      angle: -0.3 - Math.random() * 0.4,
      speed: 3 + Math.random() * 6,
      len: 60 + Math.random() * 100
    });
  }
}

function drawShootingStars() {
  shootingStars = shootingStars.filter(s => {
    s.life++;
    if (s.life > s.maxLife) return false;
    const progress = s.life / s.maxLife;
    const alpha = progress < 0.1 ? progress * 10 : (1 - progress);
    const sx = s.x + Math.cos(s.angle) * s.speed * s.life;
    const sy = s.y + Math.sin(s.angle) * s.speed * s.life;
    const ex = sx - Math.cos(s.angle) * s.len * (1 - progress * 0.4);
    const ey = sy - Math.sin(s.angle) * s.len * (1 - progress * 0.4);

    const grad = ctx.createLinearGradient(ex, ey, sx, sy);
    grad.addColorStop(0, `rgba(255,255,255,0)`);
    grad.addColorStop(0.6, `rgba(255,255,255,${alpha * 0.5})`);
    grad.addColorStop(1, `rgba(255,255,255,${alpha})`);
    ctx.strokeStyle = grad;
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(ex, ey);
    ctx.lineTo(sx, sy);
    ctx.stroke();
    return true;
  });
}

// --- Moon ---
function drawMoon() {
  const mx = W * 0.8, my = H * 0.14, mr = Math.min(W, H) * 0.055;
  // Glow
  const glow = ctx.createRadialGradient(mx, my, mr * 0.7, mx, my, mr * 4);
  glow.addColorStop(0, 'rgba(255,245,220,0.35)');
  glow.addColorStop(0.4, 'rgba(255,240,200,0.1)');
  glow.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(mx, my, mr * 4, 0, Math.PI * 2); ctx.fill();

  // Body
  ctx.fillStyle = 'rgba(255,248,230,0.92)';
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

  // Craters
  ctx.fillStyle = 'rgba(240,225,200,0.3)';
  ctx.beginPath(); ctx.arc(mx - mr * 0.25, my - mr * 0.15, mr * 0.2, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + mr * 0.3, my + mr * 0.1, mr * 0.13, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(mx - mr * 0.05, my + mr * 0.3, mr * 0.15, 0, Math.PI * 2); ctx.fill();
}

// --- Mountains ---
let mountainsLayers = [];

function initMountains() {
  mountainsLayers = [
    { color:'#081c14', yBase:0.50, amp:0.07, freq:0.0035, pts:[] },  // far
    { color:'#0c241a', yBase:0.53, amp:0.09, freq:0.0055, pts:[] },  // mid-far
    { color:'#0f2c1e', yBase:0.56, amp:0.11, freq:0.0075, pts:[] },  // mid
    { color:'#123322', yBase:0.59, amp:0.13, freq:0.0095, pts:[] },  // near
  ];
  generateMountainPts();
}

function generateMountainPts() {
  mountainsLayers.forEach(m => {
    m.pts = [];
    const step = 25;
    for (let x = -60; x <= W + 60; x += step) {
      const nx = x * m.freq;
      const h = Math.sin(nx) * 0.6
        + Math.sin(nx * 2.5 + 1.2) * 0.25
        + Math.sin(nx * 5 + 2.8) * 0.15;
      const y = H * m.yBase - h * H * m.amp;
      m.pts.push({ x, y });
    }
  });
}

function drawMountains() {
  mountainsLayers.forEach(m => {
    ctx.beginPath();
    ctx.moveTo(m.pts[0].x, m.pts[0].y);
    for (let i = 1; i < m.pts.length - 2; i++) {
      const xc = (m.pts[i].x + m.pts[i + 1].x) / 2;
      const yc = (m.pts[i].y + m.pts[i + 1].y) / 2;
      ctx.quadraticCurveTo(m.pts[i].x, m.pts[i].y, xc, yc);
    }
    const last = m.pts[m.pts.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.lineTo(W + 100, H);
    ctx.lineTo(-100, H);
    ctx.closePath();
    ctx.fillStyle = m.color;
    ctx.fill();
  });
}

// --- Mountain mist ---
function drawMist() {
  const mistY = H * 0.48;
  for (let i = 0; i < 3; i++) {
    const y = mistY + i * 12;
    const alpha = 0.04 + i * 0.02;
    const g = ctx.createLinearGradient(0, y - 20, 0, y + 20);
    g.addColorStop(0, `rgba(180,200,210,0)`);
    g.addColorStop(0.5, `rgba(180,200,210,${alpha})`);
    g.addColorStop(1, `rgba(180,200,210,0)`);
    ctx.fillStyle = g;
    ctx.fillRect(0, y - 20, W, 40);
  }
}

// --- Water ---
const waterLine = () => H * 0.6;

function drawWater() {
  const wl = waterLine();
  for (let layer = 5; layer >= 0; layer--) {
    const baseY = wl + layer * 9;
    const amp = 4 + layer * 2.8;
    const freq = 0.007 + layer * 0.0012;
    const phase = T * (0.008 + layer * 0.003);
    const da = 0.22 + layer * 0.13;

    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 2) {
      const y = baseY
        + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 2.6 + phase * 1.5) * amp * 0.4
        + Math.sin(x * freq * 0.35 + phase * 0.4) * amp * 1.1;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();

    const g = ctx.createLinearGradient(0, baseY, 0, H);
    const r = 6 + layer * 7, gr = 24 + layer * 9, b = 16 + layer * 7;
    g.addColorStop(0, `rgba(${r},${gr},${b},${da + 0.08})`);
    g.addColorStop(1, `rgba(${r + 8},${gr + 12},${b + 6},${da + 0.28})`);
    ctx.fillStyle = g;
    ctx.fill();

    if (layer === 0) {
      ctx.strokeStyle = 'rgba(160,200,180,0.08)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }
}

// --- Moon reflection on water ---
function drawMoonReflection() {
  const mx = W * 0.8, mr = Math.min(W, H) * 0.055;
  const wl = waterLine() + 8;
  for (let i = 0; i < 10; i++) {
    const ry = wl + i * 16;
    const rw = mr * 1.6 * Math.pow(1 - i / 10, 1.5);
    const rx = mx + Math.sin(T * 0.0015 + i * 0.4) * 8;
    const a = 0.12 * Math.pow(1 - i / 10, 1.2);
    ctx.fillStyle = `rgba(255,240,200,${a})`;
    ctx.beginPath();
    ctx.ellipse(rx, ry, rw, 1.5, 0, 0, Math.PI * 2);
    ctx.fill();
  }
}

// --- Water lanterns (河灯) ---
let waterLanterns = [];

function initWaterLanterns() {
  waterLanterns = [];
  for (let i = 0; i < 8; i++) {
    waterLanterns.push({
      x: Math.random() * W,
      yBase: waterLine() + 6 + Math.random() * 14,
      speed: 0.6 + Math.random() * 0.4,
      glow: 0.6 + Math.random() * 0.4,
      phase: Math.random() * Math.PI * 2
    });
  }
}

function drawWaterLanterns() {
  const wl = waterLine();
  waterLanterns.forEach(l => {
    l.x += l.speed;
    if (l.x > W + 60) { l.x = -60; l.yBase = wl + 6 + Math.random() * 16; }

    const ly = l.yBase + Math.sin(T * 0.002 + l.phase) * 3;
    // Glow on water
    const glow = ctx.createRadialGradient(l.x, ly, 0, l.x, ly, 30);
    glow.addColorStop(0, `rgba(255,140,60,${l.glow * 0.5})`);
    glow.addColorStop(0.5, `rgba(255,100,40,${l.glow * 0.15})`);
    glow.addColorStop(1, 'rgba(255,80,30,0)');
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(l.x, ly, 30, 0, Math.PI * 2); ctx.fill();

    // Lantern body
    ctx.fillStyle = `rgba(255,120,50,${l.glow})`;
    ctx.beginPath();
    ctx.ellipse(l.x, ly - 3, 8, 5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Flame
    ctx.fillStyle = `rgba(255,220,100,${l.glow})`;
    ctx.beginPath();
    ctx.arc(l.x, ly - 6, 2.5, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- Reeds / tall grass (foreground) ---
function drawReeds() {
  const wl = waterLine();
  const reedCount = Math.floor(W / 12);
  for (let i = 0; i < reedCount; i++) {
    const rx = i * (W / reedCount) + (Math.sin(i * 7.3) * 6);
    const rBase = wl + 8 + Math.abs(Math.sin(i * 3.7)) * 30;
    const sway = Math.sin(T * 0.0015 + i * 0.6) * 4;
    const sway2 = Math.sin(T * 0.002 + i * 1.1) * 2;
    const h = 40 + Math.abs(Math.sin(i * 5.1)) * 90;

    ctx.strokeStyle = 'rgba(16,40,24,0.7)';
    ctx.lineWidth = 1.8;
    ctx.beginPath();
    ctx.moveTo(rx, rBase);
    ctx.quadraticCurveTo(rx + sway * 0.5, rBase - h * 0.5, rx + sway, rBase - h);
    ctx.stroke();

    // Occasional seed tufts
    if (i % 3 === 0) {
      ctx.fillStyle = 'rgba(30,60,35,0.5)';
      ctx.beginPath();
      ctx.ellipse(rx + sway, rBase - h, 4, 8, 0.3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

// --- Dragon boats ---
let boats = [];

function initBoats() {
  boats = [
    { phase: -300, speed: 0.35, yOff: 8, scale: 0.8, timer: 0, cooldown: 500, visible: false },
    { phase: -500, speed: 0.28, yOff: 22, scale: 0.55, timer: 200, cooldown: 700, visible: false },
  ];
}

function drawDragonBoat(cx, cy, scale) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);

  // Hull
  ctx.fillStyle = '#7a3b10';
  ctx.beginPath();
  ctx.moveTo(-75, -3);
  ctx.quadraticCurveTo(-80, 10, -65, 12);
  ctx.lineTo(65, 12);
  ctx.quadraticCurveTo(80, 10, 75, -3);
  ctx.quadraticCurveTo(80, -10, 65, -14);
  ctx.lineTo(-65, -14);
  ctx.quadraticCurveTo(-80, -10, -75, -3);
  ctx.fill();
  ctx.strokeStyle = '#4a2008';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Gold stripe
  ctx.strokeStyle = '#d4a853';
  ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(-62, -4);
  ctx.lineTo(62, -4);
  ctx.stroke();

  // Dragon head
  ctx.fillStyle = '#b32d20';
  ctx.beginPath();
  ctx.moveTo(70, -5);
  ctx.quadraticCurveTo(88, -2, 82, 12);
  ctx.quadraticCurveTo(74, 6, 67, 0);
  ctx.fill();
  // Scales on head
  ctx.strokeStyle = '#d4a853';
  ctx.lineWidth = 0.8;
  for (let s = 0; s < 3; s++) {
    ctx.beginPath();
    ctx.arc(74 + s * 3, 2, 3, 0, Math.PI);
    ctx.stroke();
  }
  // Eye
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(76, -2, 3.2, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.arc(77.5, -2, 1.6, 0, Math.PI * 2); ctx.fill();
  // Horn
  ctx.strokeStyle = '#f0d78c';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(78, -6);
  ctx.quadraticCurveTo(84, -22, 74, -28);
  ctx.stroke();
  // Whiskers
  ctx.strokeStyle = '#e8c97a';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(80, 3);
  ctx.quadraticCurveTo(94, 6, 90, 18);
  ctx.stroke();
  ctx.beginPath();
  ctx.moveTo(80, 3);
  ctx.quadraticCurveTo(92, 0, 88, -10);
  ctx.stroke();

  // Dragon tail
  ctx.fillStyle = '#b32d20';
  ctx.beginPath();
  ctx.moveTo(-68, -2);
  ctx.quadraticCurveTo(-90, -4, -86, 12);
  ctx.quadraticCurveTo(-78, 6, -66, 8);
  ctx.fill();
  // Tail spikes
  ctx.strokeStyle = '#f0d78c';
  ctx.lineWidth = 1;
  for (let sp = 0; sp < 3; sp++) {
    const sx = -72 - sp * 5;
    ctx.beginPath();
    ctx.moveTo(sx, 0);
    ctx.lineTo(sx - 3, -10 + sp * 2);
    ctx.stroke();
  }

  // Paddlers
  const rowA = Math.sin(T * 0.06) * 14;
  for (let p = 0; p < 5; p++) {
    const px = -35 + p * 20;
    const a = (p % 2 === 0) ? rowA : -rowA;
    ctx.save();
    ctx.translate(px, -10);
    ctx.rotate(a * Math.PI / 180);

    // Paddle
    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 30);
    ctx.stroke();
    // Blade
    ctx.fillStyle = '#553a0a';
    ctx.beginPath();
    ctx.ellipse(0, 28, 5, 8.5, 0, 0, Math.PI * 2);
    ctx.fill();
    // Blade rim
    ctx.strokeStyle = '#d4a853';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.ellipse(0, 28, 5, 8.5, 0, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // Flag
  ctx.fillStyle = '#d42020';
  ctx.beginPath();
  ctx.moveTo(8, -16);
  ctx.lineTo(30, -20);
  ctx.lineTo(8, -26);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Pole
  ctx.strokeStyle = '#7a5a10';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(8, -12);
  ctx.lineTo(8, -28);
  ctx.stroke();
  // Flag character
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 10px serif';
  ctx.textAlign = 'center';
  ctx.fillText('楚', 22, -19);

  // Drum
  ctx.fillStyle = '#6b2010';
  ctx.beginPath();
  ctx.arc(40, -8, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#d4a853';
  ctx.lineWidth = 1.2;
  ctx.stroke();
  // Drum top
  ctx.fillStyle = '#e8d5b0';
  ctx.beginPath();
  ctx.arc(40, -10, 7, 0, Math.PI * 2);
  ctx.fill();

  // Boat wake
  ctx.strokeStyle = 'rgba(180,210,200,0.15)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-65, 10);
  for (let w = 0; w < 60; w++) {
    const wx = -65 - w;
    const wy = 10 + w * 0.08 + Math.sin(w * 0.3) * 1.5;
    ctx.lineTo(wx, wy);
  }
  ctx.stroke();

  ctx.restore();
}

function updateBoats() {
  boats.forEach(b => {
    b.timer++;
    if (b.timer > b.cooldown) {
      if (b.timer === b.cooldown + 1) {
        b.phase = -300;
        b.visible = true;
        b.cooldown = 500 + Math.random() * 600;
      }
    }
    if (b.visible) {
      b.phase += b.speed;
      if (b.phase > W + 400) { b.visible = false; b.timer = 0; }
    }
  });
}

function drawBoats() {
  const wl = waterLine();
  boats.forEach(b => {
    if (b.visible) {
      const by = wl + b.yOff + Math.sin(T * 0.0012 + b.phase * 0.01) * 4;
      drawDragonBoat(b.phase, by, b.scale);
    }
  });
}

// --- Canvas fireflies ---
let canvasFF = [];

function initCanvasFF() {
  canvasFF = [];
  for (let i = 0; i < 40; i++) {
    canvasFF.push({
      bx: Math.random() * W,
      by: waterLine() + Math.random() * H * 0.35,
      phase: Math.random() * Math.PI * 2,
      speed: 0.004 + Math.random() * 0.018,
      wander: 15 + Math.random() * 60
    });
  }
}

function drawCanvasFF() {
  canvasFF.forEach(f => {
    const fx = f.bx + Math.sin(T * f.speed + f.phase) * f.wander;
    const fy = f.by + Math.cos(T * f.speed * 0.7 + f.phase + 1) * f.wander * 0.5;
    const a = 0.2 + 0.8 * Math.abs(Math.sin(T * 0.025 + f.phase));
    const g = ctx.createRadialGradient(fx, fy, 0, fx, fy, 12);
    g.addColorStop(0, `rgba(255,240,170,${a})`);
    g.addColorStop(0.35, `rgba(253,210,100,${a * 0.5})`);
    g.addColorStop(1, 'rgba(253,200,80,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(fx, fy, 12, 0, Math.PI * 2);
    ctx.fill();
  });
}

// --- Water shimmer particles ---
let waterSparkles = [];

function initWaterSparkles() {
  waterSparkles = [];
  for (let i = 0; i < 50; i++) {
    waterSparkles.push({
      x: Math.random() * W,
      y: waterLine() + Math.random() * H * 0.2,
      phase: Math.random() * Math.PI * 2,
      speed: 0.01 + Math.random() * 0.03
    });
  }
}

function drawWaterSparkles() {
  waterSparkles.forEach(s => {
    const a = 0.15 + 0.85 * Math.abs(Math.sin(T * s.speed + s.phase));
    ctx.fillStyle = `rgba(200,220,200,${a * 0.5})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, 0.8, 0, Math.PI * 2);
    ctx.fill();
    // Occasionally brighter
    if (Math.abs(Math.sin(T * s.speed + s.phase)) > 0.95) {
      ctx.fillStyle = `rgba(255,255,230,${a})`;
      ctx.beginPath();
      ctx.arc(s.x, s.y, 1.5, 0, Math.PI * 2);
      ctx.fill();
    }
  });
}

// --- Main render ---
function draw(timestamp) {
  T = timestamp;
  drawSky();
  drawStars();
  drawMoon();
  maybeSpawnShootingStar();
  drawShootingStars();
  drawMountains();
  drawMist();
  drawWater();
  drawMoonReflection();
  drawWaterSparkles();
  drawWaterLanterns();
  updateBoats();
  drawBoats();
  drawReeds();
  drawCanvasFF();
  requestAnimationFrame(draw);
}

function initScene() {
  initStars();
  initMountains();
  initWaterLanterns();
  initBoats();
  initCanvasFF();
  initWaterSparkles();
}
initScene();
requestAnimationFrame(draw);

// ============================================================
//  CSS PARTICLES
// ============================================================
const PTRAY = document.getElementById('ptray');
const EMOJIS = ['🐉','🌿','✨','🎋','🏮','🐲','🍃','🥚','🪷','⭐','🎑','🐲'];

// --- Lantern ---
function spawnLantern(x, y) {
  const el = document.createElement('div');
  el.className = 'lantern';
  el.innerHTML = '<div class="lantern-body"></div><div class="lantern-tassel"></div>';
  const dur = 7 + Math.random() * 9;
  const drift = -60 + Math.random() * 120;
  const uid = 'lk' + Date.now() + Math.floor(Math.random() * 1e6);
  const sty = document.createElement('style');
  sty.textContent = `@keyframes ${uid}{0%{transform:translateY(0) scale(0.4) translateX(0);opacity:0}8%{opacity:0.95}82%{opacity:0.55}100%{transform:translateY(-115vh) scale(1.25) translateX(${drift}px);opacity:0}}`;
  document.head.appendChild(sty);
  el.style.cssText = `left:${x}px;top:${y}px;animation:${uid} ${dur}s ease-out forwards`;
  PTRAY.appendChild(el);
  setTimeout(() => { el.remove(); sty.remove(); }, dur * 1000 + 600);
}

// --- Firefly ---
function spawnFirefly(x, y) {
  const el = document.createElement('div');
  el.className = 'firefly';
  const uid = 'ff' + Date.now() + Math.floor(Math.random() * 1e6);
  const dx = -25 + Math.random() * 50, dy = -30 + Math.random() * 60;
  const sty = document.createElement('style');
  sty.textContent = `@keyframes ${uid}{0%,100%{transform:translate(0,0) scale(1);opacity:0.2}25%{transform:translate(${dx*0.6}px,${dy}px) scale(1.6);opacity:0.95}50%{transform:translate(${-dx*0.3}px,${dy*1.5}px) scale(0.9);opacity:0.4}75%{transform:translate(${dx*0.8}px,${dy*0.6}px) scale(1.4);opacity:0.85}}`;
  document.head.appendChild(sty);
  el.style.cssText = `left:${x}px;top:${y}px;animation:${uid} ${3+Math.random()*5}s ease-in-out`;
  PTRAY.appendChild(el);
  setTimeout(() => { el.remove(); sty.remove(); }, 8000);
}

// --- Bamboo leaf ---
function spawnLeaf(x, y) {
  const el = document.createElement('div');
  el.className = 'bamboo-leaf';
  const sz = 14 + Math.random() * 22;
  const hue = 95 + Math.random() * 50;
  el.innerHTML = `<svg width="${sz}" height="${sz*2.5}" viewBox="0 0 20 50" style="transform:rotate(${Math.random()*360}deg)"><path d="M10 2 Q3 15 5 35 Q10 48 10 48 Q10 48 15 35 Q17 15 10 2Z" fill="hsl(${hue},55%,${26+Math.random()*30}%)" opacity="0.75"/></svg>`;
  const uid = 'bl' + Date.now() + Math.floor(Math.random() * 1e6);
  const drift = -30 + Math.random() * 60;
  const sty = document.createElement('style');
  sty.textContent = `@keyframes ${uid}{0%{transform:translateY(-5vh) rotate(0deg) translateX(0);opacity:1}60%{opacity:0.6}100%{transform:translateY(108vh) rotate(${360+Math.random()*360}deg) translateX(${drift}px);opacity:0}}`;
  document.head.appendChild(sty);
  el.style.cssText = `left:${x}px;top:${y}px;animation:${uid} ${5+Math.random()*8}s ease-in forwards`;
  PTRAY.appendChild(el);
  setTimeout(() => { el.remove(); sty.remove(); }, 14000);
}

// ============================================================
//  CLICK HANDLER
// ============================================================
document.addEventListener('click', e => {
  const cx = e.clientX, cy = e.clientY;

  // Sparkles
  for (let i = 0; i < 7; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];
    const a = Math.random() * Math.PI * 2;
    const d = 25 + Math.random() * 60;
    s.style.cssText = `left:${cx+Math.cos(a)*d}px;top:${cy+Math.sin(a)*d}px;animation-delay:${Math.random()*0.18}s`;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 1000);
  }

  // Lanterns
  const lc = 1 + Math.floor(Math.random() * 4);
  for (let i = 0; i < lc; i++) {
    setTimeout(() => spawnLantern(cx + (Math.random() - 0.5) * 80, cy), i * 180);
  }

  // Fireflies
  for (let i = 0; i < 10; i++) spawnFirefly(cx, cy);
  // Leaves
  for (let i = 0; i < 5; i++) spawnLeaf(cx + (Math.random() - 0.5) * 100, cy - 20);

  // Ripples on the lower half
  if (cy > H * 0.55) {
    const r = document.createElement('div');
    r.className = 'ripple';
    r.style.cssText = `left:${cx}px;top:${cy}px`;
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 1600);
  }
});
