<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐉 端午安康 · 吴总 🐉</title>
<style>
:root {
  --gold: #d4a050;
  --goldBright: #f5deb0;
  --text: #f4efe4;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  width:100vw; min-height:100vh;
  background:#020812;
  font-family:"Noto Serif SC","STKaiti","KaiTi","SimSun",serif;
  overflow-x:hidden; cursor:default;
  user-select:none; -webkit-tap-highlight-color:transparent;
}

/* ===== CANVAS ===== */
#cv { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; }

/* ===== PARTICLES ===== */
#pt { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:1; }

/* ===== SKY LANTERN ===== */
.sl {
  position:fixed; pointer-events:none; z-index:2;
}
.sl .b {
  width:28px; height:40px;
  background:radial-gradient(ellipse at 50% 35%, #ffb870 0%, #f06030 42%, #c02814 100%);
  border-radius:50% 50% 36% 36%;
  box-shadow:0 0 26px rgba(255,160,60,0.6), 0 0 60px rgba(255,100,40,0.3), 0 0 100px rgba(255,70,30,0.08);
  margin:0 auto; position:relative;
}
.sl .b::before {
  content:''; position:absolute; top:-7px; left:50%; transform:translateX(-50%);
  width:20px; height:7px; background:#c9a050; border-radius:3px 3px 1px 1px;
}
.sl .b::after {
  content:''; position:absolute; bottom:-11px; left:50%; transform:translateX(-50%);
  width:2px; height:11px; background:rgba(200,160,100,0.7);
}
.sl .t {
  width:6px; height:13px;
  background:linear-gradient(to bottom, #c9a050, #e8c870);
  margin:0 auto; border-radius:0 0 3px 3px;
  animation:sw 1.6s ease-in-out infinite;
}
@keyframes sw { 0%,100%{transform:rotate(-5deg)} 50%{transform:rotate(5deg)} }

/* ===== FIREFLY ===== */
.ff {
  position:fixed; pointer-events:none; z-index:3;
  width:5px; height:5px; border-radius:50%;
  background:radial-gradient(circle, #fffde0, rgba(255,240,180,0));
  box-shadow:0 0 10px #ffe870, 0 0 22px rgba(255,220,100,0.55), 0 0 38px rgba(255,200,80,0.18);
}

/* ===== CHERRY BLOSSOM ===== */
.cb {
  position:fixed; pointer-events:none; z-index:2;
}

/* ===== GOLDEN MOTE ===== */
.gm {
  position:fixed; pointer-events:none; z-index:4;
  width:4px; height:4px; border-radius:50%;
  background:radial-gradient(circle, #fff9d0, rgba(255,215,0,0));
  box-shadow:0 0 8px #ffd700, 0 0 20px rgba(255,200,0,0.5);
}

/* ===== LIGHT RAIN ===== */
.rain-drop {
  position:fixed; pointer-events:none; z-index:2;
  width:1px; background:linear-gradient(to bottom, rgba(180,200,220,0), rgba(180,200,220,0.35));
  animation:rainFall linear forwards;
}
@keyframes rainFall {
  0% { transform:translateY(-10vh); opacity:0; }
  10% { opacity:0.5; }
  90% { opacity:0.3; }
  100% { transform:translateY(105vh); opacity:0; }
}

/* ===== INK SPLASH ===== */
.ink {
  position:fixed; pointer-events:none; z-index:99;
  border-radius:50%;
  background:radial-gradient(circle, rgba(10,20,15,0.55) 0%, rgba(30,60,40,0.25) 35%, transparent 65%);
  animation:inkBurst 1.3s ease-out forwards;
}
@keyframes inkBurst {
  0% { width:0; height:0; opacity:1; }
  100% { width:340px; height:340px; opacity:0; margin-left:-170px; margin-top:-170px; }
}

/* ===== SHAKE ===== */
.shaking { animation:shake 0.4s ease-out; }
@keyframes shake {
  0%,100%{transform:translate(0,0)}
  10%{transform:translate(-5px,4px)}
  20%{transform:translate(5px,-3px)}
  30%{transform:translate(-4px,-3px)}
  40%{transform:translate(3px,4px)}
  50%{transform:translate(-3px,-2px)}
  60%{transform:translate(3px,2px)}
  70%{transform:translate(-1px,-1px)}
  80%{transform:translate(1px,1px)}
  90%{transform:translate(-0.5px,0)}
}

/* ===== WATER SPLASH ===== */
.wsp {
  position:fixed; pointer-events:none; z-index:6;
}
.wsp .d {
  position:absolute; width:3px; height:3px; border-radius:50%;
  background:rgba(200,220,210,0.7);
  animation:dp 0.7s ease-out forwards;
}
@keyframes dp {
  0% { transform:translate(0,0) scale(1); opacity:1; }
  100% { transform:translate(var(--dx),var(--dy)) scale(0); opacity:0; }
}

/* ===== SPARKLE ===== */
.sk {
  position:fixed; pointer-events:none; font-size:30px; z-index:100;
  animation:skPop 0.95s ease-out forwards;
}
@keyframes skPop {
  0% { transform:scale(0) translateY(0); opacity:1; }
  100% { transform:scale(1.8) translateY(-90px); opacity:0; }
}

/* ═══════════ SCROLL CARD ═══════════ */
.scroll-stage {
  position:fixed; top:0; left:0; width:100%; height:100%;
  display:flex; align-items:center; justify-content:center;
  z-index:10; pointer-events:none;
}
.scroll {
  pointer-events:auto; position:relative;
  width:90%; max-width:560px;
  animation:scrollReveal 2s cubic-bezier(0.22,1,0.36,1) both;
}
@keyframes scrollReveal {
  0% { opacity:0; transform:scale(0.85); filter:blur(16px); }
  60% { filter:blur(0); }
  100% { opacity:1; transform:scale(1); filter:blur(0); }
}

/* Scroll container */
.scroll-inner {
  position:relative;
  background:linear-gradient(180deg,
    rgba(12,18,30,0.7) 0%,
    rgba(16,22,36,0.72) 30%,
    rgba(16,22,36,0.72) 70%,
    rgba(12,18,30,0.7) 100%
  );
  backdrop-filter:blur(32px); -webkit-backdrop-filter:blur(32px);
  border-left:1.5px solid rgba(220,170,60,0.3);
  border-right:1.5px solid rgba(220,170,60,0.3);
  padding:48px 36px 40px;
  text-align:center;
  box-shadow:
    0 20px 100px rgba(0,0,0,0.6),
    0 0 120px rgba(220,170,60,0.05),
    inset 0 1px 0 rgba(255,255,255,0.02);
  overflow:visible;
}

/* Top scroll rod */
.scroll-rod-top, .scroll-rod-bottom {
  height:10px;
  background:linear-gradient(180deg, #8b6914 0%, #c9a050 30%, #e8c870 50%, #c9a050 70%, #8b6914 100%);
  border-radius:5px;
  box-shadow:0 2px 12px rgba(0,0,0,0.5), 0 0 20px rgba(200,160,60,0.15);
}
.scroll-rod-top { margin-bottom:2px; }
.scroll-rod-bottom { margin-top:2px; }

/* Rod end knobs */
.scroll-rod-top::before, .scroll-rod-top::after,
.scroll-rod-bottom::before, .scroll-rod-bottom::after {
  content:''; position:absolute; top:-6px;
  width:18px; height:22px; border-radius:50%;
  background:radial-gradient(circle at 40% 35%, #c9a050, #6b4008);
  box-shadow:0 3px 10px rgba(0,0,0,0.5);
}
.scroll-rod-top::before, .scroll-rod-bottom::before { left:-8px; }
.scroll-rod-top::after, .scroll-rod-bottom::after { right:-8px; }

/* Scroll content animation - unfurl effect */
.scroll-body {
  overflow:hidden;
  animation:unfurl 1.2s cubic-bezier(0.22,1,0.36,1) 0.8s both;
}
@keyframes unfurl {
  0% { max-height:0; opacity:0; }
  100% { max-height:800px; opacity:1; }
}

/* Title area */
.scroll-icons {
  font-size:40px; margin-bottom:18px;
  animation:floatIcons 3.5s ease-in-out 1.5s infinite;
}
@keyframes floatIcons {
  0%,100% { transform:translateY(0); }
  50% { transform:translateY(-12px); }
}

.scroll-title-group {
  margin-bottom:10px;
}

/* Individual character reveal */
.scroll-title-group .char {
  display:inline-block;
  font-size:clamp(2.5rem, 7vw, 4rem);
  font-weight:900;
  opacity:0;
  animation:charReveal 0.5s cubic-bezier(0.34,1.56,0.64,1) forwards;
  background:linear-gradient(180deg, #fdf0c0 0%, #d4a040 40%, #b08020 100%);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 20px rgba(240,200,100,0.4));
}
@keyframes charReveal {
  0% { opacity:0; transform:translateY(30px) scale(0.5); filter:blur(12px); }
  60% { opacity:1; transform:translateY(-5px) scale(1.1); filter:blur(0); }
  100% { opacity:1; transform:translateY(0) scale(1); filter:blur(0); }
}

/* Subtitle */
.scroll-sub {
  font-size:0.8rem; color:rgba(220,180,100,0.45);
  letter-spacing:6px; margin-bottom:6px;
  opacity:0; animation:fadeIn 0.6s ease-out 2s forwards;
}
@keyframes fadeIn {
  0% { opacity:0; transform:translateY(8px); }
  100% { opacity:1; transform:translateY(0); }
}

/* Dedication line */
.scroll-dedication {
  font-size:1.3rem; color:rgba(240,210,140,0.8);
  margin-bottom:28px; letter-spacing:4px;
  opacity:0; animation:fadeIn 0.7s ease-out 2.3s forwards;
}
.scroll-dedication .hl {
  display:inline-block;
  font-size:1.7rem; font-weight:700;
  background:linear-gradient(180deg, #ffe8a0, #d4a040);
  -webkit-background-clip:text; background-clip:text;
  -webkit-text-fill-color:transparent;
  filter:drop-shadow(0 0 16px rgba(240,200,100,0.5));
}

/* Divider ornament */
.scroll-ornament {
  width:100%; text-align:center;
  font-size:14px; color:var(--gold); opacity:0.3;
  margin-bottom:20px; letter-spacing:8px;
  opacity:0; animation:fadeIn 0.5s ease-out 2.6s forwards;
}

/* Blessing lines */
.scroll-wish {
  font-size:1.1rem; color:var(--text);
  line-height:2.5; text-align:center;
}
.scroll-wish .wl {
  opacity:0;
  animation:wishIn 0.7s ease-out forwards;
  white-space:pre-line;
  display:block;
}
@keyframes wishIn {
  0% { opacity:0; transform:translateX(-20px); filter:blur(4px); }
  100% { opacity:1; transform:translateX(0); filter:blur(0); }
}

/* Signature with stamp */
.scroll-sig-area {
  margin-top:24px; text-align:center;
  opacity:0; animation:fadeIn 0.8s ease-out 6.2s forwards;
}
.scroll-divider {
  width:60px; height:1px;
  background:linear-gradient(90deg, transparent, var(--gold), transparent);
  margin:0 auto 12px; opacity:0.4;
}
.scroll-sig {
  font-size:1rem; color:rgba(245,220,140,0.6);
  font-style:italic; margin-bottom:10px;
}
.scroll-stamp {
  display:inline-block;
  width:56px; height:56px;
  border:2px solid rgba(200,50,30,0.7);
  border-radius:8px;
  color:rgba(200,50,30,0.75);
  font-size:20px; font-weight:900;
  line-height:52px; text-align:center;
  transform:rotate(-8deg);
  font-family:"STKaiti","KaiTi",serif;
  box-shadow:inset 0 0 8px rgba(200,50,30,0.15);
}

/* Floating around the scroll */
.scroll-glow {
  position:absolute; top:-30px; left:-30px; right:-30px; bottom:-30px;
  border-radius:30px;
  pointer-events:none; z-index:-1;
  background:radial-gradient(ellipse at 50% 50%, rgba(220,170,60,0.04) 0%, transparent 70%);
  animation:glowBreath 4s ease-in-out infinite;
}
@keyframes glowBreath {
  0%,100% { opacity:0.5; }
  50% { opacity:1; }
}

/* ===== RESPONSIVE ===== */
@media (max-width:480px) {
  .scroll-inner { padding:36px 20px 30px; }
  .scroll-title-group .char { font-size:2rem; }
  .scroll-icons { font-size:30px; }
  .scroll-dedication { font-size:1rem; }
  .scroll-dedication .hl { font-size:1.3rem; }
  .scroll-wish { font-size:0.9rem; line-height:2.2; }
  .sl .b { width:20px; height:30px; }
}
</style>
</head>
<body>

<canvas id="cv"></canvas>
<div id="pt"></div>

<!-- ═══════════ SCROLL CARD ═══════════ -->
<div class="scroll-stage">
  <div class="scroll">
    <div class="scroll-rod-top" style="position:relative;"></div>
    <div class="scroll-inner">
      <div class="scroll-glow"></div>

      <div class="scroll-body">
        <div class="scroll-icons">🐉🌿🏮🌿🐉</div>

        <div class="scroll-title-group">
          <span class="char" style="animation-delay:0.3s">端</span><!--
       --><span class="char" style="animation-delay:0.45s">午</span><!--
       --><span class="char" style="animation-delay:0.6s">安</span><!--
       --><span class="char" style="animation-delay:0.75s">康</span>
        </div>

        <div class="scroll-sub">DRAGON BOAT FESTIVAL · 2026</div>

        <div class="scroll-ornament">━ ✦ ✦ ✦ ━</div>

        <div class="scroll-wish">
          <span class="wl" style="animation-delay:2.3s">粽叶飘香，龙舟竞渡</span>
          <span class="wl" style="animation-delay:2.8s">又是一年端阳时</span>
          <span class="wl" style="animation-delay:3.4s">愿你的生活如糯米般软糯香甜</span>
          <span class="wl" style="animation-delay:4.0s">愿你的人生如龙舟般乘风破浪</span>
          <span class="wl" style="animation-delay:4.6s">艾蒲青青，为你驱散世间烦忧</span>
          <span class="wl" style="animation-delay:5.2s">世界很大，但总有一个人记得你</span>
          <span class="wl" style="animation-delay:5.7s">节日很多，但这个端午只为你祈愿</span>
        </div>

        <div class="scroll-sig-area">
          <div class="scroll-divider"></div>
          <div class="scroll-sig">—— 端午安康，吴总 🌟</div>
          <div class="scroll-stamp">安</div>
        </div>
      </div>
    </div>
    <div class="scroll-rod-bottom" style="position:relative;"></div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════╗
// ║  国漫级 · 端午浪漫夜景 — Canvas Scene                ║
// ╚══════════════════════════════════════════════════════════╝
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let W,H,T=0;
function rs(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
rs();addEventListener('resize',()=>{rs();initAll();});

// ─── MOON ───
const moon={x:0,y:0,r:0};
function setMoon(){moon.x=W*0.82;moon.y=H*0.1;moon.r=Math.min(W,H)*0.052;}

// ─── STARS ───
let stars=[];
function initStars(){stars=[];for(let i=0;i<280;i++){const w=i<60;stars.push({x:Math.random()*W,y:Math.random()*H*0.5,r:0.3+Math.random()*2.2,ph:Math.random()*PI2,sp:0.002+Math.random()*0.04,w});}}
const PI2=Math.PI*2;

function drawStars(){
  stars.forEach(s=>{
    const a=0.18+0.82*Math.abs(Math.sin(s.ph+T*s.sp));
    ctx.fillStyle=s.w?`rgba(255,${210+Math.floor(Math.random()*45)},${120+Math.floor(Math.random()*80)},${a})`:`rgba(220,240,255,${a})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,PI2);ctx.fill();
  });
}

// ─── AURORA WISPS ───
function drawAurora(){
  for(let i=0;i<4;i++){
    const ay=H*0.06+i*H*0.04;
    const ax=T*0.02+i*300;
    for(let j=0;j<3;j++){
      const g=ctx.createLinearGradient(0,ay-20,0,ay+20);
      const hue=280+i*15+j*10;
      g.addColorStop(0,`hsla(${hue},60%,65%,0)`);
      g.addColorStop(0.5,`hsla(${hue},60%,65%,0.03)`);
      g.addColorStop(1,`hsla(${hue},60%,65%,0)`);
      ctx.fillStyle=g;
      ctx.beginPath();
      ctx.moveTo(0,ay-20);
      for(let x=0;x<=W;x+=10){
        const y=ay+Math.sin(x*0.003+ax+j*2)*12+Math.sin(x*0.007+ax*0.7)*6;
        ctx.lineTo(x,y);
      }
      ctx.lineTo(W,ay+20);ctx.lineTo(0,ay+20);ctx.fill();
    }
  }
}

// ─── SHOOTING STARS ───
let shoot=[];
function drawShoot(){
  if(Math.random()<0.008&&shoot.length<4)shoot.push({x:W*0.1+Math.random()*W*0.8,y:H*0.02+Math.random()*H*0.18,life:0,max:40+Math.random()*80,ang:-0.25-Math.random()*0.5,spd:3+Math.random()*8,len:50+Math.random()*130});
  shoot=shoot.filter(s=>{
    s.life++;if(s.life>s.max)return false;
    const p=s.life/s.max,a=p<0.1?p*10:(1-p);
    const sx=s.x+Math.cos(s.ang)*s.spd*s.life,sy=s.y+Math.sin(s.ang)*s.spd*s.life;
    const ex=sx-Math.cos(s.ang)*s.len*(1-p*0.25),ey=sy-Math.sin(s.ang)*s.len*(1-p*0.25);
    const g=ctx.createLinearGradient(ex,ey,sx,sy);
    g.addColorStop(0,'rgba(255,255,255,0)');
    g.addColorStop(0.4,`rgba(255,255,250,${a*0.35})`);
    g.addColorStop(1,`rgba(255,255,240,${a})`);
    ctx.strokeStyle=g;ctx.lineWidth=1.6;
    ctx.beginPath();ctx.moveTo(ex,ey);ctx.lineTo(sx,sy);ctx.stroke();
    return true;
  });
}

// ─── MOON + GOD RAYS ───
function drawMoon(){
  const mx=moon.x,my=moon.y,mr=moon.r;
  // God rays
  for(let i=0;i<18;i++){
    const ang=(i/18)*PI2+T*0.00008;
    const rl=mr*2.2+mr*1.8*Math.abs(Math.sin(i*3.1+T*0.0004));
    const g=ctx.createLinearGradient(mx,my,mx+Math.cos(ang)*rl,my+Math.sin(ang)*rl);
    const a=0.03+0.025*Math.abs(Math.sin(i*2.1));
    g.addColorStop(0,`rgba(255,248,215,${a*1.6})`);
    g.addColorStop(0.25,`rgba(255,240,200,${a})`);
    g.addColorStop(1,'rgba(255,240,200,0)');
    ctx.fillStyle=g;
    ctx.beginPath();ctx.moveTo(mx,my);
    ctx.lineTo(mx+Math.cos(ang-0.12)*rl,my+Math.sin(ang-0.12)*rl);
    ctx.lineTo(mx+Math.cos(ang+0.12)*rl,my+Math.sin(ang+0.12)*rl);ctx.fill();
  }
  // Glow
  const glow=ctx.createRadialGradient(mx,my,mr*0.5,mx,my,mr*5.5);
  glow.addColorStop(0,'rgba(255,250,230,0.5)');
  glow.addColorStop(0.25,'rgba(255,240,200,0.1)');
  glow.addColorStop(1,'rgba(255,240,200,0)');
  ctx.fillStyle=glow;ctx.beginPath();ctx.arc(mx,my,mr*5.5,0,PI2);ctx.fill();
  // Body
  ctx.fillStyle='rgba(255,252,240,0.92)';ctx.beginPath();ctx.arc(mx,my,mr,0,PI2);ctx.fill();
  ctx.fillStyle='rgba(235,215,190,0.22)';
  ctx.beginPath();ctx.arc(mx-mr*0.2,my-mr*0.1,mr*0.22,0,PI2);ctx.fill();
  ctx.beginPath();ctx.arc(mx+mr*0.35,my+mr*0.15,mr*0.14,0,PI2);ctx.fill();
  ctx.beginPath();ctx.arc(mx-mr*0.05,my+mr*0.35,mr*0.16,0,PI2);ctx.fill();
}

// ─── MOUNTAINS ───
let mts=[];
function initMts(){mts=[{c:'#061812',yb:0.46,a:0.07,f:0.003,pts:[]},{c:'#0a1f18',yb:0.49,a:0.09,f:0.005,pts:[]},{c:'#0e261c',yb:0.52,a:0.11,f:0.007,pts:[]},{c:'#122e20',yb:0.55,a:0.14,f:0.0095,pts:[]}];genMtPts();}
function genMtPts(){mts.forEach(m=>{m.pts=[];for(let x=-60;x<=W+60;x+=20){const nx=x*m.f;const h=Math.sin(nx)*0.55+Math.sin(nx*2.7+1.3)*0.28+Math.sin(nx*5.2+2.9)*0.17;m.pts.push({x,y:H*m.yb-h*H*m.a});}});}
function drawMts(){mts.forEach(m=>{ctx.beginPath();ctx.moveTo(m.pts[0].x,m.pts[0].y);for(let i=1;i<m.pts.length-2;i++){const xc=(m.pts[i].x+m.pts[i+1].x)/2,yc=(m.pts[i].y+m.pts[i+1].y)/2;ctx.quadraticCurveTo(m.pts[i].x,m.pts[i].y,xc,yc);}const l=m.pts[m.pts.length-1];ctx.lineTo(l.x,l.y);ctx.lineTo(W+100,H);ctx.lineTo(-100,H);ctx.closePath();ctx.fillStyle=m.c;ctx.fill();});}

// ─── MIST ───
function drawMist(){const my=H*0.44;for(let i=0;i<5;i++){const y=my+i*13,a=0.02+i*0.018;const g=ctx.createLinearGradient(0,y-25,0,y+25);g.addColorStop(0,`rgba(150,185,200,0)`);g.addColorStop(0.5,`rgba(150,185,200,${a})`);g.addColorStop(1,`rgba(150,185,200,0)`);ctx.fillStyle=g;ctx.fillRect(0,y-25,W,50);}}

// ─── DISTANT FIREWORKS ───
let fwks=[];
function drawFireworks(){
  if(Math.random()<0.015&&fwks.length<3){
    fwks.push({x:W*0.1+Math.random()*W*0.8,y:H*0.08+Math.random()*H*0.2,life:0,max:50+Math.random()*80,particles:[],hue:Math.random()<0.5?30+Math.random()*20:340+Math.random()*20});
  }
  fwks=fwks.filter(f=>{
    f.life++;
    if(f.life===1) for(let i=0;i<30;i++){const a=Math.random()*PI2,d=20+Math.random()*50;f.particles.push({x:f.x,y:f.y,vx:Math.cos(a)*d*0.06,vy:Math.sin(a)*d*0.06,life:0,maxLife:30+Math.random()*40});}
    const alpha=f.life<10?f.life/10:(1-(f.life-10)/f.max);
    f.particles.forEach(p=>{
      p.life++;p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;
      const pa=p.life/p.maxLife<0.3?1:(1-(p.life-0.3*p.maxLife)/(0.7*p.maxLife));
      if(pa<=0)return;
      ctx.fillStyle=`hsla(${f.hue},80%,${60+Math.random()*30}%,${pa*alpha})`;
      ctx.beginPath();ctx.arc(p.x,p.y,1.2,0,PI2);ctx.fill();
    });
    return f.life<f.max;
  });
}

// ─── WATER ───
const wl=()=>H*0.58;
function drawWater(){
  const w=wl();
  for(let l=5;l>=0;l--){
    const by=w+l*9,amp=4+l*3,freq=0.006+l*0.0012,ph=T*(0.007+l*0.003),da=0.18+l*0.13;
    ctx.beginPath();ctx.moveTo(0,H);
    for(let x=0;x<=W;x+=2){
      const y=by+Math.sin(x*freq+ph)*amp+Math.sin(x*freq*2.7+ph*1.4)*amp*0.38+Math.sin(x*freq*0.33+ph*0.35)*amp*1;
      ctx.lineTo(x,y);
    }
    ctx.lineTo(W,H);ctx.closePath();
    const g=ctx.createLinearGradient(0,by,0,H);
    const r=5+l*7,gr=20+l*11,b=14+l*8;
    g.addColorStop(0,`rgba(${r},${gr},${b},${da+0.05})`);
    g.addColorStop(1,`rgba(${r+10},${gr+14},${b+8},${da+0.24})`);
    ctx.fillStyle=g;ctx.fill();
    if(l===0){ctx.strokeStyle='rgba(140,190,170,0.05)';ctx.lineWidth=1;ctx.stroke();}
  }
}

// ─── MAIN RENDER ───
function draw(ts){
  T=ts;
  // Romantic twilight sky
  const sg=ctx.createLinearGradient(0,0,0,H);
  sg.addColorStop(0,'#050d20');sg.addColorStop(0.22,'#0a1635');
  sg.addColorStop(0.48,'#0f2240');sg.addColorStop(0.7,'#152e3a');
  sg.addColorStop(0.86,'#1a3a32');sg.addColorStop(1,'#0e281a');
  ctx.fillStyle=sg;ctx.fillRect(0,0,W,H);

  drawAurora();
  drawStars();
  drawShoot();
  drawFireworks();
  drawMoon();
  drawMts();
  drawMist();
  drawWater();
  drawMoonRefl();
  drawWS();
  drawLotus();
  updateKois();kois.forEach(drawKoi);
  drawSplashRings();
  drawWlnt();
  updateBoats();drawBoats();
  updateCranes();cranes.forEach(drawCrane);
  drawReeds();
  drawCff();
  drawGoldM();

  requestAnimationFrame(draw);
}

  const drift=-50+Math.random()*100,rot=360+Math.random()*900;
  const st=document.createElement('style');
  st.textContent=`@keyframes ${uid}{0%{transform:translateY(-6vh) rotate(0deg) translateX(0);opacity:1}60%{opacity:0.45}100%{transform:translateY(110vh) rotate(${rot}deg) translateX(${drift}px);opacity:0}}`;
  document.head.appendChild(st);
  el.style.cssText=`left:${x}px;top:${y}px;animation:${uid} ${7+Math.random()*12}s ease-in forwards`;
  PT.appendChild(el);setTimeout(()=>{el.remove();st.remove();},20000);
}

// Golden mote
function spGoldM(x,y){
  const el=document.createElement('div');el.className='gm';
  const uid='gm'+Date.now()+Math.floor(Math.random()*1e6);
  const dx=-50+Math.random()*100,dy=-70-Math.random()*120;
  const st=document.createElement('style');
  st.textContent=`@keyframes ${uid}{0%{transform:translate(0,0) scale(0);opacity:0}15%{transform:translate(${dx*0.25}px,${dy*0.25}px) scale(1.2);opacity:0.95}100%{transform:translate(${dx}px,${dy}px) scale(0);opacity:0}}`;
  document.head.appendChild(st);
  el.style.cssText=`left:${x}px;top:${y}px;animation:${uid} ${1.2+Math.random()*2.5}s ease-out forwards`;
  PT.appendChild(el);setTimeout(()=>{el.remove();st.remove();},4000);
}

// Click interaction
document.addEventListener('click',e=>{
  const cx=e.clientX,cy=e.clientY;

  // Ink splash + shake
  const ink=document.createElement('div');ink.className='ink';
  ink.style.cssText=`left:${cx}px;top:${cy}px`;document.body.appendChild(ink);
  setTimeout(()=>ink.remove(),1400);
  document.body.classList.add('shaking');
  setTimeout(()=>document.body.classList.remove('shaking'),400);

  // Golden burst
  for(let i=0;i<18;i++)spGoldM(cx+(Math.random()-0.5)*50,cy+(Math.random()-0.5)*50);

  // Sparkles
  for(let i=0;i<10;i++){
    const s=document.createElement('div');s.className='sk';s.textContent=EM[Math.floor(Math.random()*EM.length)];
    const a=Math.random()*PI2,d=35+Math.random()*80;
    s.style.cssText=`left:${cx+Math.cos(a)*d}px;top:${cy+Math.sin(a)*d}px;animation-delay:${Math.random()*0.22}s`;
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000);
  }

  // Lanterns
  const lc=1+Math.floor(Math.random()*5);
  for(let i=0;i<lc;i++)setTimeout(()=>spL(cx+(Math.random()-0.5)*90,cy),i*170);

  // Fireflies
  for(let i=0;i<14;i++)spFf(cx,cy);

  // Blossoms
  for(let i=0;i<8;i++)spBlossom(cx+(Math.random()-0.5)*140,cy-25);

  // Water splash
  if(cy>H*0.5){
    const ws=document.createElement('div');ws.className='wsp';
    ws.style.cssText=`left:${cx}px;top:${cy}px`;
    for(let i=0;i<14;i++){
      const d=document.createElement('div');d.className='d';
      const a=Math.random()*PI2,dist=18+Math.random()*45;
      d.style.setProperty('--dx',Math.cos(a)*dist+'px');
      d.style.setProperty('--dy',Math.sin(a)*dist+'px');ws.appendChild(d);
    }
    document.body.appendChild(ws);setTimeout(()=>ws.remove(),800);
  }
});

// Ambient spawners
setInterval(()=>{spL(Math.random()*W*0.85+W*0.05,H*0.55+Math.random()*H*0.4);},3200);
setInterval(()=>{spBlossom(Math.random()*W,-15);},1400);
setInterval(()=>{spFf(Math.random()*W,H*0.42+Math.random()*H*0.52);},2000);
setInterval(()=>{spGoldM(Math.random()*W,Math.random()*H);},500);
setInterval(()=>{if(Math.random()<0.35)for(let i=0;i<3;i++)spRain();},200);

// Initial burst
setTimeout(()=>{for(let i=0;i<12;i++)setTimeout(()=>spL(W*0.1+Math.random()*W*0.8,H*0.55+Math.random()*H*0.35),i*280);},2200);

console.log('💛 点击屏幕释放水墨炸裂 + 金色灵气 + 樱花 + 孔明灯~');
