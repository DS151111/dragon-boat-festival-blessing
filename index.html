<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐉 端午安康 🐉</title>
<style>
  :root {
    --gold: #d4a853;
    --jade: #5b8c5a;
    --ink: #1a1a2e;
    --card-bg: rgba(26, 26, 46, 0.65);
    --text: #f0e6d3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 100vw; min-height: 100vh;
    background: #0a1628;
    font-family: "Noto Serif SC", "STSong", "SimSun", "KaiTi", "STKaiti", serif;
    overflow-x: hidden;
    cursor: default;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  /* ===== Canvas Scene ===== */
  #scene {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    z-index: 0;
  }

  /* ===== Particle Layers ===== */
  .lantern {
    position: fixed;
    pointer-events: none;
    z-index: 2;
    animation: lanternRise linear forwards;
  }
  .lantern-body {
    width: 32px; height: 42px;
    background: radial-gradient(ellipse at 50% 40%, #ff8c42 0%, #e85d3a 40%, #c0392b 100%);
    border-radius: 50% 50% 40% 40%;
    box-shadow: 0 0 20px rgba(255,140,66,0.5), 0 0 60px rgba(255,100,50,0.25), 0 0 100px rgba(255,80,40,0.12);
    position: relative;
    margin: 0 auto;
  }
  .lantern-body::before {
    content: '';
    position: absolute; top: -6px; left: 50%; transform: translateX(-50%);
    width: 18px; height: 6px;
    background: #c9a96e;
    border-radius: 3px 3px 1px 1px;
  }
  .lantern-body::after {
    content: '';
    position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%);
    width: 1px; height: 8px;
    background: rgba(201,169,110,0.8);
  }
  .lantern-tassel {
    width: 8px; height: 12px;
    background: linear-gradient(to bottom, #c9a96e, #e8c97a);
    margin: 0 auto;
    border-radius: 0 0 2px 2px;
    animation: tasselSway 1.5s ease-in-out infinite;
  }
  @keyframes lanternRise {
    0% { transform: translateY(0) scale(0.5); opacity: 0; }
    10% { opacity: 0.9; }
    85% { opacity: 0.6; }
    100% { transform: translateY(-110vh) scale(1.2); opacity: 0; }
  }
  @keyframes tasselSway {
    0%, 100% { transform: rotate(-3deg); }
    50% { transform: rotate(3deg); }
  }

  .firefly {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    width: 6px; height: 6px;
    background: radial-gradient(circle, #ffeaa7, rgba(253,203,110,0));
    border-radius: 50%;
    box-shadow: 0 0 6px #ffeaa7, 0 0 14px rgba(253,203,110,0.5);
    animation: fireflyFloat 4s ease-in-out infinite;
  }
  @keyframes fireflyFloat {
    0%, 100% { transform: translate(0, 0) scale(1); opacity: 0.3; }
    25% { transform: translate(15px, -20px) scale(1.5); opacity: 0.9; }
    50% { transform: translate(-5px, -35px) scale(1); opacity: 0.5; }
    75% { transform: translate(-18px, -15px) scale(1.3); opacity: 0.8; }
  }

  .bamboo-leaf {
    position: fixed;
    pointer-events: none;
    z-index: 2;
    animation: leafFall linear forwards;
  }
  @keyframes leafFall {
    0% { transform: translateY(-5vh) rotate(0deg) translateX(0); opacity: 1; }
    70% { opacity: 0.7; }
    100% { transform: translateY(105vh) rotate(540deg) translateX(60px); opacity: 0; }
  }

  /* ===== Main Card ===== */
  .overlay {
    position: fixed; top: 0; left: 0;
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    z-index: 10; pointer-events: none;
  }
  .card {
    pointer-events: auto;
    background: var(--card-bg);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border: 1px solid rgba(212,168,83,0.35);
    border-radius: 24px;
    padding: 48px 40px;
    max-width: 580px; width: 88%;
    text-align: center;
    position: relative;
    box-shadow: 0 8px 48px rgba(0,0,0,0.4), 0 0 60px rgba(212,168,83,0.08), inset 0 1px 0 rgba(255,255,255,0.04);
    animation: cardEnter 1.2s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes cardEnter {
    0% { opacity: 0; transform: translateY(40px) scale(0.95); }
    100% { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* Chinese-style corner ornaments */
  .card::before {
    content: '❖';
    position: absolute; top: 12px; left: 16px;
    color: var(--gold); opacity: 0.5; font-size: 14px;
  }
  .card::after {
    content: '❖';
    position: absolute; top: 12px; right: 16px;
    color: var(--gold); opacity: 0.5; font-size: 14px;
  }
  .card-ornament-bottom {
    position: absolute; bottom: 12px; left: 16px;
    color: var(--gold); opacity: 0.5; font-size: 14px;
  }
  .card-ornament-bottom-r {
    position: absolute; bottom: 12px; right: 16px;
    color: var(--gold); opacity: 0.5; font-size: 14px;
  }

  .card .zongzi-row {
    font-size: 40px; margin-bottom: 12px;
    animation: gentleBob 3s ease-in-out infinite;
  }
  @keyframes gentleBob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .card h1 {
    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 700;
    background: linear-gradient(135deg, #e8c97a, #d4a853, #c9974a, #e8c97a);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: goldShimmer 3s ease-in-out infinite;
    margin-bottom: 6px;
    letter-spacing: 4px;
  }
  @keyframes goldShimmer {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .card .subtitle {
    font-size: 0.9rem;
    color: rgba(232,201,122,0.65);
    letter-spacing: 3px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  .card .wish {
    font-size: 1.05rem;
    color: var(--text);
    line-height: 2.2;
    text-align: center;
    min-height: 120px;
  }
  .card .wish .line {
    opacity: 0;
    animation: fadeInLine 0.6s ease-out forwards;
    white-space: pre-line;
  }
  @keyframes fadeInLine {
    0% { opacity: 0; transform: translateY(8px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  .card .divider {
    width: 60px; height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 20px auto;
    opacity: 0.6;
  }
  .card .signature {
    font-size: 0.95rem;
    color: rgba(232,201,122,0.7);
    font-style: italic;
    margin-top: 8px;
    opacity: 0;
    animation: fadeInLine 0.8s ease-out forwards;
  }

  /* ===== Click sparkle ===== */
  .sparkle {
    position: fixed; pointer-events: none;
    font-size: 28px; z-index: 100;
    animation: sparklePop 0.9s ease-out forwards;
  }
  @keyframes sparklePop {
    0% { transform: scale(0) translateY(0); opacity: 1; }
    100% { transform: scale(1.6) translateY(-70px); opacity: 0; }
  }

  /* ===== Water ripple on click ===== */
  .ripple {
    position: fixed; pointer-events: none;
    border-radius: 50%;
    border: 1px solid rgba(212,168,83,0.5);
    z-index: 5;
    animation: rippleOut 1.5s ease-out forwards;
  }
  @keyframes rippleOut {
    0% { width: 0; height: 0; opacity: 0.8; }
    100% { width: 120px; height: 120px; opacity: 0; margin-left: -60px; margin-top: -60px; }
  }

  /* ===== Water Splash on click ===== */
  .splash {
    position: fixed; pointer-events: none;
    z-index: 5;
    animation: splashPop 0.7s ease-out forwards;
  }
  @keyframes splashPop {
    0% { transform: scale(0.3); opacity: 1; }
    100% { transform: scale(1.2) translateY(-30px); opacity: 0; }
  }

  /* ===== Responsive ===== */
  @media (max-width: 480px) {
    .card { padding: 32px 24px; border-radius: 20px; }
    .card h1 { font-size: 1.8rem; letter-spacing: 2px; }
    .card .zongzi-row { font-size: 32px; }
    .card .wish { font-size: 0.95rem; line-height: 2; }
    .lantern-body { width: 24px; height: 32px; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>

<div id="particles-tray" style="position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1;"></div>

<div class="overlay">
  <div class="card" id="card">
    <div class="card-ornament-bottom">❖</div>
    <div class="card-ornament-bottom-r">❖</div>
    <div class="zongzi-row">🐉🌿🐲🌿🐉</div>
    <h1>端午安康</h1>
    <div class="subtitle">Dragon Boat Festival · 2026</div>
    <div class="wish" id="wish">
      <div class="line" style="animation-delay:0.6s;">粽叶飘香，龙舟竞渡</div>
      <div class="line" style="animation-delay:1.2s;">又是一年端阳时</div>
      <div class="line" style="animation-delay:1.8s;">愿你的生活如糯米般软糯香甜</div>
      <div class="line" style="animation-delay:2.4s;">愿你的人生如龙舟般乘风破浪</div>
      <div class="line" style="animation-delay:3.1s;">艾蒲青青，为你驱散世间烦忧</div>
      <div class="line" style="animation-delay:3.8s;">粽香袅袅，包裹我所有的祝福</div>
      <div class="line" style="animation-delay:4.6s;">世界很大，但总有一个人记得你</div>
      <div class="line" style="animation-delay:5.3s;">节日很多，但这个端午只为你祈愿</div>
    </div>
    <div class="divider"></div>
    <div class="signature" style="animation-delay:5.8s;">—— 端午安康，吴总 🌟</div>
  </div>
</div>

<script>
// ========== CANVAS SCENE ==========
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');

let W, H, time = 0;
const resize = () => {
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
};
resize();
window.addEventListener('resize', resize);

// --- Stars ---
const stars = [];
for (let i = 0; i < 120; i++) {
  stars.push({
    x: Math.random() * 2000,
    y: Math.random() * H * 0.55,
    r: 0.4 + Math.random() * 1.6,
    twinklePhase: Math.random() * Math.PI * 2,
    twinkleSpeed: 0.01 + Math.random() * 0.03
  });
}

// --- Mountains (3 layers) ---
const mountains = [
  // Far layer
  { color: '#0f2a1f', yBase: 0.52, amp: 0.08, freq: 0.004, points: [] },
  // Mid layer
  { color: '#112d22', yBase: 0.55, amp: 0.10, freq: 0.0065, points: [] },
  // Near layer
  { color: '#143325', yBase: 0.58, amp: 0.12, freq: 0.008, points: [] }
];

function generateMountainPoints(layer) {
  const pts = [];
  const step = 30;
  for (let x = -50; x <= W + 50; x += step) {
    const nx = x * layer.freq;
    // Use multiple octaves of sine for natural look
    const h = Math.sin(nx) * 0.7 + Math.sin(nx * 2.3 + 1) * 0.2 + Math.sin(nx * 4.7 + 2.5) * 0.1;
    const y = H * layer.yBase - h * H * layer.amp;
    pts.push({ x, y });
  }
  return pts;
}
mountains.forEach((m, i) => { mountains[i].points = generateMountainPoints(m); });

// --- Water waves ---
function drawWaterLine(baseY, amplitude, frequency, phase, color, alpha) {
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let x = 0; x <= W; x += 3) {
    const y = baseY + Math.sin(x * frequency + phase) * amplitude
      + Math.sin(x * frequency * 2.7 + phase * 1.8) * amplitude * 0.4
      + Math.sin(x * frequency * 0.4 + phase * 0.6) * amplitude * 1.3;
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.globalAlpha = alpha;
  ctx.fill();
  ctx.globalAlpha = 1;
}

// --- Dragon boat ---
const boatCycle = { phase: -400, speed: 0.4, visible: false, timer: 0, cooldown: 300 };

function drawDragonBoat(x, y) {
  const s = Math.min(W / 800, 1.2); // scale
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);

  // Boat body
  ctx.beginPath();
  ctx.moveTo(-80, -5);
  ctx.quadraticCurveTo(-85, 8, -70, 10);
  ctx.lineTo(70, 10);
  ctx.quadraticCurveTo(85, 8, 80, -5);
  ctx.quadraticCurveTo(85, -8, 70, -12);
  ctx.lineTo(-70, -12);
  ctx.quadraticCurveTo(-85, -8, -80, -5);
  ctx.fillStyle = '#8b4513';
  ctx.fill();
  ctx.strokeStyle = '#5c2e0a';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Gold trim
  ctx.strokeStyle = '#d4a853';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(-70, -3);
  ctx.lineTo(70, -3);
  ctx.stroke();

  // Dragon head (front)
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.moveTo(75, -5);
  ctx.quadraticCurveTo(90, 0, 85, 10);
  ctx.quadraticCurveTo(78, 5, 72, 0);
  ctx.fill();
  // Dragon eye
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(80, -1, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#111';
  ctx.beginPath();
  ctx.arc(81, -1, 1.5, 0, Math.PI * 2);
  ctx.fill();
  // Dragon horn
  ctx.strokeStyle = '#d4a853';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(82, -5);
  ctx.quadraticCurveTo(86, -18, 78, -22);
  ctx.stroke();
  // Dragon whisker
  ctx.strokeStyle = '#e8c97a';
  ctx.lineWidth = 0.8;
  ctx.beginPath();
  ctx.moveTo(83, 3);
  ctx.quadraticCurveTo(92, 8, 88, 15);
  ctx.stroke();

  // Dragon tail (back)
  ctx.fillStyle = '#c0392b';
  ctx.beginPath();
  ctx.moveTo(-75, -3);
  ctx.quadraticCurveTo(-92, -3, -88, 8);
  ctx.quadraticCurveTo(-82, 2, -74, 5);
  ctx.fill();

  // Paddles
  const rowPhase = Math.sin(time * 0.08) * 15;
  for (let i = 0; i < 5; i++) {
    const px = -40 + i * 22;
    const angle = (i % 2 === 0) ? rowPhase : -rowPhase;
    ctx.save();
    ctx.translate(px, -8);
    ctx.rotate(angle * Math.PI / 180);
    ctx.strokeStyle = '#8b6914';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.lineTo(0, 28);
    ctx.stroke();
    // Paddle blade
    ctx.fillStyle = '#6b4410';
    ctx.beginPath();
    ctx.ellipse(0, 26, 4, 7, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  // Little flag
  ctx.fillStyle = '#e74c3c';
  ctx.beginPath();
  ctx.moveTo(10, -15);
  ctx.lineTo(30, -18);
  ctx.lineTo(10, -22);
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.stroke();
  // Flag pole
  ctx.strokeStyle = '#8b6914';
  ctx.lineWidth = 1.5;
  ctx.beginPath();
  ctx.moveTo(10, -12);
  ctx.lineTo(10, -25);
  ctx.stroke();

  ctx.restore();
}

// --- Clouds ---
const clouds = [];
for (let i = 0; i < 5; i++) {
  clouds.push({
    x: Math.random() * W,
    y: H * (0.08 + Math.random() * 0.22),
    w: 60 + Math.random() * 140,
    speed: 0.1 + Math.random() * 0.25,
    alpha: 0.06 + Math.random() * 0.08
  });
}

// --- Firefly data for canvas ---
const canvasFireflies = [];
for (let i = 0; i < 30; i++) {
  canvasFireflies.push({
    x: Math.random() * W,
    y: H * (0.5 + Math.random() * 0.45),
    phase: Math.random() * Math.PI * 2,
    speed: 0.005 + Math.random() * 0.02,
    baseX: Math.random() * W,
    baseY: H * (0.5 + Math.random() * 0.45),
    wander: 20 + Math.random() * 50
  });
}

// --- Moon ---
const moonX = W * 0.82, moonY = H * 0.14, moonR = Math.min(W, H) * 0.06;

function drawScene() {
  ctx.clearRect(0, 0, W, H);

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
  skyGrad.addColorStop(0, '#060d1f');
  skyGrad.addColorStop(0.3, '#0a1a3a');
  skyGrad.addColorStop(0.5, '#132e4a');
  skyGrad.addColorStop(0.7, '#1e4d5c');
  skyGrad.addColorStop(0.85, '#2a6058');
  skyGrad.addColorStop(1, '#1a3d2e');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H);

  // Moon
  ctx.fillStyle = 'rgba(255,240,210,0.95)';
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR, 0, Math.PI * 2);
  ctx.fill();
  // Moon glow
  const moonGlow = ctx.createRadialGradient(moonX, moonY, moonR * 0.8, moonX, moonY, moonR * 3.5);
  moonGlow.addColorStop(0, 'rgba(255,240,200,0.25)');
  moonGlow.addColorStop(0.5, 'rgba(255,240,200,0.06)');
  moonGlow.addColorStop(1, 'rgba(255,240,200,0)');
  ctx.fillStyle = moonGlow;
  ctx.beginPath();
  ctx.arc(moonX, moonY, moonR * 3.5, 0, Math.PI * 2);
  ctx.fill();

  // Moon reflection on water
  const waterReflY = H * 0.62;
  ctx.fillStyle = 'rgba(255,240,200,0.12)';
  for (let i = 0; i < 8; i++) {
    const ry = waterReflY + 20 + i * 18;
    const rw = moonR * 1.5 * (1 - i / 8) + Math.sin(time * 0.02 + i) * 6;
    ctx.beginPath();
    ctx.ellipse(moonX, ry, rw, 2, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Clouds
  clouds.forEach(c => {
    ctx.fillStyle = `rgba(180,200,220,${c.alpha})`;
    ctx.beginPath();
    ctx.ellipse(c.x, c.y, c.w, c.w * 0.35, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x - c.w * 0.25, c.y + 5, c.w * 0.55, c.w * 0.25, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(c.x + c.w * 0.3, c.y + 3, c.w * 0.5, c.w * 0.22, 0, 0, Math.PI * 2);
    ctx.fill();
  });

  // Stars
  stars.forEach(s => {
    const alpha = 0.3 + 0.7 * Math.abs(Math.sin(s.twinklePhase + time * s.twinkleSpeed));
    ctx.fillStyle = `rgba(255,255,240,${alpha})`;
    ctx.beginPath();
    ctx.arc(s.x % W, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  });

  // Mountains
  mountains.forEach(m => {
    ctx.beginPath();
    ctx.moveTo(m.points[0].x, m.points[0].y);
    for (let i = 1; i < m.points.length - 2; i++) {
      const xc = (m.points[i].x + m.points[i + 1].x) / 2;
      const yc = (m.points[i].y + m.points[i + 1].y) / 2;
      ctx.quadraticCurveTo(m.points[i].x, m.points[i].y, xc, yc);
    }
    const last = m.points[m.points.length - 1];
    ctx.lineTo(last.x, last.y);
    ctx.lineTo(W + 50, H);
    ctx.lineTo(-50, H);
    ctx.closePath();
    ctx.fillStyle = m.color;
    ctx.fill();
  });

  // Water layers (back to front)
  const waterStart = H * 0.58;
  for (let layer = 4; layer >= 0; layer--) {
    const depthAlpha = 0.25 + layer * 0.15;
    const baseY = waterStart + layer * 10;
    const amp = 6 + layer * 2.5;
    const freq = 0.008 + layer * 0.001;
    const phase = time * (0.012 + layer * 0.004);
    ctx.beginPath();
    ctx.moveTo(0, H);
    for (let x = 0; x <= W; x += 3) {
      const y = baseY + Math.sin(x * freq + phase) * amp
        + Math.sin(x * freq * 2.3 + phase * 1.7) * amp * 0.45
        + Math.sin(x * freq * 0.45 + phase * 0.5) * amp * 1.2;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W, H);
    ctx.closePath();
    const waterGrad = ctx.createLinearGradient(0, baseY, 0, H);
    const r = 8 + layer * 8;
    const g = 28 + layer * 10;
    const b = 18 + layer * 8;
    waterGrad.addColorStop(0, `rgba(${r},${g},${b},${depthAlpha + 0.1})`);
    waterGrad.addColorStop(1, `rgba(${r + 6},${g + 10},${b + 5},${depthAlpha + 0.3})`);
    ctx.fillStyle = waterGrad;
    ctx.fill();

    // Water surface highlight
    if (layer === 0) {
      ctx.strokeStyle = 'rgba(180,210,190,0.15)';
      ctx.lineWidth = 1;
      ctx.stroke();
    }
  }

  // Canvas fireflies near water
  canvasFireflies.forEach(ff => {
    const fx = ff.baseX + Math.sin(time * ff.speed + ff.phase) * ff.wander;
    const fy = ff.baseY + Math.cos(time * ff.speed * 0.7 + ff.phase) * ff.wander * 0.6;
    const alpha = 0.25 + 0.75 * Math.abs(Math.sin(time * 0.03 + ff.phase));
    const glow = ctx.createRadialGradient(fx, fy, 0, fx, fy, 10);
    glow.addColorStop(0, `rgba(255,234,167,${alpha})`);
    glow.addColorStop(0.4, `rgba(253,203,110,${alpha * 0.5})`);
    glow.addColorStop(1, 'rgba(253,203,110,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(fx, fy, 10, 0, Math.PI * 2);
    ctx.fill();
  });

  // Dragon boat
  boatCycle.timer++;
  if (boatCycle.timer > boatCycle.cooldown) {
    if (boatCycle.timer === boatCycle.cooldown + 1) {
      boatCycle.phase = -200;
      boatCycle.visible = true;
      boatCycle.cooldown = 400 + Math.random() * 300;
    }
  }
  if (boatCycle.visible) {
    const boatY = waterStart + 15 + Math.sin(time * 0.015) * 5;
    drawDragonBoat(boatCycle.phase, boatY);
    boatCycle.phase += boatCycle.speed;
    if (boatCycle.phase > W + 200) {
      boatCycle.visible = false;
      boatCycle.timer = 0;
    }
  }
}

function updateScene() {
  // Update clouds
  clouds.forEach(c => {
    c.x += c.speed;
    if (c.x > W + c.w) c.x = -c.w * 2;
  });

  // Update mountains on resize
  mountains.forEach((m, i) => {
    mountains[i].points = generateMountainPoints(m);
  });
}

// ========== CSS PARTICLES ==========
const emojis = ['🐉', '🌿', '✨', '🎋', '🏮', '🐲', '🍃', '🥚', '🪷', '⭐'];

// --- Lantern spawn ---
function spawnLantern(x, y) {
  const tray = document.getElementById('particles-tray');
  const lantern = document.createElement('div');
  lantern.className = 'lantern';
  lantern.innerHTML = '<div class="lantern-body"></div><div class="lantern-tassel"></div>';
  const duration = 6 + Math.random() * 8;
  const drift = -50 + Math.random() * 100;
  Object.assign(lantern.style, {
    left: x + 'px',
    top: y + 'px',
    animationDuration: duration + 's',
    '--drift': drift + 'px'
  });
  // Override animation for drift
  const styleEl = document.createElement('style');
  const uid = 'l' + Date.now() + Math.random();
  styleEl.textContent = `
    @keyframes lanternRise { 
      0% { transform: translateY(0) scale(0.5) translateX(0); opacity: 0; }
      10% { opacity: 0.9; }
      85% { opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(1.2) translateX(${drift}px); opacity: 0; }
    }
  `;
  document.head.appendChild(styleEl);
  lantern.style.animation = `lanternRise ${duration}s linear forwards`;

  tray.appendChild(lantern);
  setTimeout(() => {
    lantern.remove();
    styleEl.remove();
  }, duration * 1000 + 500);
}

// --- Firefly CSS spawn ---
function spawnFirefly(x, y) {
  const tray = document.getElementById('particles-tray');
  const ff = document.createElement('div');
  ff.className = 'firefly';
  Object.assign(ff.style, {
    left: (x + (Math.random() - 0.5) * 40) + 'px',
    top: (y + (Math.random() - 0.5) * 40) + 'px',
    animationDuration: (2.5 + Math.random() * 4) + 's'
  });
  tray.appendChild(ff);
  setTimeout(() => ff.remove(), 7000);
}

// --- Bamboo leaf ---
function spawnLeaf(x, y) {
  const tray = document.getElementById('particles-tray');
  const leaf = document.createElement('div');
  leaf.className = 'bamboo-leaf';
  const size = 12 + Math.random() * 18;
  const hue = 100 + Math.random() * 40;
  leaf.innerHTML = `<svg width="${size}" height="${size * 2.5}" viewBox="0 0 20 50" style="transform:rotate(${Math.random()*360}deg)">
    <path d="M10 2 Q3 15 5 35 Q10 48 10 48 Q10 48 15 35 Q17 15 10 2Z" fill="hsl(${hue},50%,${30+Math.random()*25}%)" opacity="0.8"/>
  </svg>`;
  Object.assign(leaf.style, {
    left: x + 'px',
    top: y + 'px',
    animationDuration: (4 + Math.random() * 7) + 's',
    animationDelay: Math.random() * 0.5 + 's'
  });
  tray.appendChild(leaf);
  setTimeout(() => leaf.remove(), 12000);
}

// ========== CLICK INTERACTION ==========
document.addEventListener('click', (e) => {
  const cx = e.clientX, cy = e.clientY;

  // Sparkles
  for (let i = 0; i < 5; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    const angle = Math.random() * Math.PI * 2;
    const dist = 20 + Math.random() * 50;
    s.style.cssText = `
      left: ${cx + Math.cos(angle) * dist}px;
      top: ${cy + Math.sin(angle) * dist}px;
      animation-delay: ${Math.random() * 0.15}s;
    `;
    document.body.appendChild(s);
    setTimeout(() => s.remove(), 900);
  }

  // Spawn lantern (1-3)
  const lanternCount = 1 + Math.floor(Math.random() * 3);
  for (let i = 0; i < lanternCount; i++) {
    setTimeout(() => spawnLantern(cx + (Math.random()-0.5)*60, cy), i * 200);
  }

  // Fireflies
  for (let i = 0; i < 8; i++) {
    spawnFirefly(cx, cy);
  }

  // Bamboo leaves
  for (let i = 0; i < 4; i++) {
    spawnLeaf(cx + (Math.random()-0.5)*80, cy - 20);
  }

  // Water ripple (if in lower part)
  if (cy > H * 0.55) {
    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.cssText = `left:${cx}px; top:${cy}px;`;
    document.body.appendChild(ripple);
    setTimeout(() => ripple.remove(), 1500);
  }
});

// ========== AUTO PARTICLES ==========
// Ambient lanterns
setInterval(() => {
  const x = Math.random() * W * 0.9 + W * 0.05;
  const y = H * 0.5 + Math.random() * H * 0.45;
  spawnLantern(x, y);
}, 4000);

// Ambient leaves
setInterval(() => {
  const x = Math.random() * W;
  spawnLeaf(x, -10);
}, 2000);

// Ambient fireflies
setInterval(() => {
  const x = Math.random() * W;
  const y = H * 0.5 + Math.random() * H * 0.45;
  spawnFirefly(x, y);
}, 3000);

// ========== RENDER LOOP ==========
function loop(ts) {
  time = ts;
  drawScene();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// Update on resize
window.addEventListener('resize', () => {
  resize();
  updateScene();
});
